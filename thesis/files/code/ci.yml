---
name: "CI"

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["develop"]
  workflow_dispatch: {}

jobs:
  run-tests:
    name: "Run Tests"
    runs-on: ["archlinux"]
    strategy:
      fail-fast: false

    container:
      image: "localhost/erpai/python-ci:3.12"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Python"
        run: python --version

      - name: "Cache pip"
        uses: actions/cache@v4
        with:
          path: "~/.cache/pip" 
          key: >-
            ${{ runner.os }}-pip-py312-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-py312-
            ${{ runner.os }}-pip- 

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          if [ -f auth-server/requirements.txt ]; then python -m pip install -r auth-server/requirements.txt; fi
          if [ -f duckdb/requirements.txt ]; then python -m pip install -r duckdb/requirements.txt; fi
          if [ -f forecasting/requirements.txt ]; then python -m pip install -r forecasting/requirements.txt; fi
          python -m pip install pytest pytest-asyncio anyio pytest-cov

      - name: "Run tests with coverage"
        env:
          DATABASE_URL: "sqlite://"
          DUCKDB_DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest -q --cov-report=xml --cov-report=html
